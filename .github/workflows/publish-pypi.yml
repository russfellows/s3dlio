name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

# Plain logs: no ANSI color in cargo output (dtolnay/rust-toolchain only turns it on when unset),
# so logs read cleanly and scripts that parse cargo output (check_fork_safety_deps.sh) see plain text.
env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev
      
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3.11 python3.12 python3.13 --features extension-module,backend-azure
          sccache: 'true'
          manylinux: auto
          before-script-linux: |
            yum install -y hdf5-devel openssl-devel perl-IPC-Cmd || apt-get install -y libhdf5-dev libssl-dev || true
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [linux, sdist]
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - name: List artifacts
        run: ls -lah dist/

      # The `test-hooks` feature (s3dlio._hold_async_runtime(), which freezes the async runtime, and
      # s3dlio._test_close_exit_gate_after_next_spawn(), which refuses every later async call) must never
      # reach PyPI: no compiled module in any wheel may contain either symbol.
      - name: Assert the wheels contain no test hooks
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          hooks = (b"_hold_async_runtime", b"_test_close_exit_gate_after_next_spawn")
          bad = []
          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
              sys.exit("no wheels in dist/")
          for w in wheels:
              with zipfile.ZipFile(w) as z:
                  for n in z.namelist():
                      if n.endswith((".so", ".pyd", ".dylib")):
                          data = z.read(n)
                          bad += [f"{w}: {n}: {h.decode()}" for h in hooks if h in data]
          if bad:
              sys.exit("test hook found in a release wheel:\n" + "\n".join(bad))
          print("ok: no test hooks in", len(wheels), "wheels")
          PY
      
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
