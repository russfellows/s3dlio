name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege for every job: CI only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # 3.14 (#302): the cp314 wheel is built by the same `maturin build` step below (PyO3 0.29 supports it);
        # the exit test file is what exercises the CPython 3.14 thread-state race. Written without being able
        # to run GitHub Actions; the build and the exit file were run locally on CPython 3.14.10.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Harden cargo against transient crates.io / curl flakes.
      # The job repeatedly failed at `cargo build` with
      #   error: failed to get `arrow-array` ... curl failed
      # which is the curl-8.x HTTP/2 multiplexing bug.  The dtolnay action's
      # built-in workaround only fires for rustc 1.70/1.71; runner is on 1.96.
      # - sparse: opt in explicitly (default since 1.70, but harmless to pin)
      # - multiplexing=false: forces HTTP/1.1 to dodge the curl bug
      # - timeout=120: generous per-download budget
      - name: Configure cargo network robustness
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [http]
          multiplexing = false
          timeout = 120
          EOF

      - name: Cache cargo registry, git deps, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # Pre-fetch with retries before any build/test step.  Splits the
      # network-sensitive phase from the compile phase so a registry
      # hiccup retries cheaply instead of failing a 1-minute cargo build.
      - name: Fetch dependencies (with retry)
        run: |
          for i in 1 2 3; do
            cargo fetch --locked && break
            echo "cargo fetch failed (attempt $i); retrying..."
            sleep $((i * 10))
          done

      - name: Build (Rust)
        run: cargo build --release --offline

      # S3DLIO_TEST_DIR is a directory on the runner's disk (ext4, supports O_DIRECT and caches
      # pages); S3DLIO_REQUIRE_ODIRECT_TESTS=1 turns a test that would SKIP (scratch filesystem
      # without O_DIRECT, tmpfs where the page-cache hint cannot be observed) into a failure.
      - name: Test (Rust)
        env:
          S3DLIO_REQUIRE_ODIRECT_TESTS: "1"
        run: |
          export S3DLIO_TEST_DIR="$GITHUB_WORKSPACE/target/odirect-scratch"
          mkdir -p "$S3DLIO_TEST_DIR"
          cargo test --release --lib --offline

      # The slower Rust-only integration steps (delete_batch grouping, the
      # GCS/Azure feature build, the op-log lifecycle binaries) run once per OS
      # in the parallel `rust-extra` job below, not once per Python version here.

      # The zstd command-line tool is what the op-log tests use to prove a
      # finished log is a complete zstd stream; the Python op-log tests below
      # skip without it, so fail here if it is missing instead.
      - name: Install zstd CLI (op-log tests)
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y zstd; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "apt-get update/install failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt-get failed (attempt $i); retrying..."
            sleep $((i * 5))
          done
          zstd --version

      # Same feature set as the PyPI wheels (.github/workflows/publish-pypi.yml):
      # S3 + Azure + file/direct. GCS is not in the PyPI build (git dependencies).
      - name: Build (Python)
        run: |
          pip install maturin
          # `test-hooks` adds the hidden s3dlio._hold_async_runtime() (deterministic op-log tests, #294) and
          # s3dlio._test_close_exit_gate_after_next_spawn() (#304 test). This wheel is a TEST wheel: it is not the one published (publish-pypi.yml builds without it
          # and asserts both symbols are absent).
          maturin build --release --out dist --features extension-module,backend-azure,test-hooks
          pip install dist/*.whl
      
      - name: Test (Python - Basic)
        run: |
          python -c "import s3dlio; data = s3dlio.generate_data(1024); print(f'✓ Generated {len(data)} bytes')"
          python -c "import s3dlio; t = s3dlio.py_total_cpus(); d = s3dlio.py_default_data_gen_threads(); print(f'✓ CPUs: {t}, Default threads: {d}')"
      
      - name: Test (Python - Zero-Copy)
        run: |
          python -c "import s3dlio; data = s3dlio.generate_data(1024*1024); view = memoryview(data); print(f'✓ Zero-copy memoryview: {len(view)} bytes')"
          python -c "import s3dlio; buf = bytearray(1024); n = s3dlio.generate_into_buffer(buf); print(f'✓ Zero-copy write: {n} bytes')"

      # The Azure backend is in the wheel built above (as in the PyPI wheels), so a
      # wheel without it must FAIL here, not skip: S3DLIO_REQUIRE_FULL_BACKENDS=1.
      # The one GCS test in the file is deselected (GCS is not in this wheel). The
      # tests talk to a local fake Blob service; no Azure account or network is used.
      # NOTE: written without being able to run GitHub Actions.
      - name: Test (Python - Azure backend)
        env:
          S3DLIO_REQUIRE_FULL_BACKENDS: "1"
        run: |
          pip install pytest
          python -m pytest -q -rs python/tests/test_full_backend_azure_gcs.py \
            --deselect python/tests/test_full_backend_azure_gcs.py::test_gcs_backend_is_compiled_in_and_get_many_refuses_bad_batches_before_any_request

      # Op-log Python tests against the wheel built and installed above (the
      # wheel is the artifact that exercises the PyO3 boundary: init/finalize,
      # the GIL release in finalize_op_log, destination errors). Each scenario
      # runs in a fresh interpreter; they need the zstd CLI installed earlier.
      # NOTE: written without being able to run GitHub Actions; see the commit
      # message for what was and was not verified locally.
      # S3DLIO_REQUIRE_TEST_HOOKS=1: the deterministic call-time tests (#294) FAIL, not skip, on a wheel
      # built without the `test-hooks` feature.
      - name: Test (Python - op-log)
        env:
          S3DLIO_REQUIRE_TEST_HOOKS: "1"
        run: |
          pip install pytest
          python -m pytest -q tests/test_oplog_lifecycle.py tests/test_python_oplog.py \
            tests/test_oplog_store_cache.py tests/test_oplog_lifecycle_permutations_294.py \
            tests/test_oplog_async_call_time_294.py

      # Caller-buffer get_into / typed head / object_capabilities for file:// and direct://
      # (#295, #267) and the S3 caller-buffer tests, against the wheel installed above. The
      # scratch directory is on the runner's disk (O_DIRECT works there); with
      # S3DLIO_REQUIRE_ODIRECT_TESTS=1 python/tests/conftest.py turns EVERY skip in these files
      # (no O_DIRECT, numpy or pytest-asyncio missing, a wheel without the native S3 path) into a
      # failure.
      - name: Test (Python - get_into file:// direct:// and S3 caller-buffer)
        env:
          S3DLIO_REQUIRE_ODIRECT_TESTS: "1"
        run: |
          export S3DLIO_TEST_DIR="$GITHUB_WORKSPACE/odirect-scratch"
          mkdir -p "$S3DLIO_TEST_DIR"
          pip install pytest pytest-asyncio numpy
          python -m pytest -q -rs python/tests/test_get_into_file_direct_295.py \
            python/tests/test_caller_buffer_get_into.py python/tests/test_conftest_fail_on_skip_295.py

      # Interpreter exit with daemon threads inside s3dlio calls (#298): every scenario runs in a
      # fresh subprocess and must exit 0 with no FATAL on stderr. RED on CPython < 3.13.8 (the 3.11
      # and 3.12 matrix cells) with PyO3 < 0.29.3; the `>=0.29.3, <0.30` requirement in Cargo.toml keeps it green.
      # #302 (CPython 3.14: a Tokio worker attaching to Python) and #304 (Python < 3.13.8: an async call
      # starting during shutdown) are probabilistic crashes (1/30 to 30/30 runs depending on the call), so
      # this step repeats each scenario S3DLIO_EXIT_ATTEMPTS times instead of the local default of 3.
      - name: Test (Python - exit with daemon threads, #298 #302 #304)
        env:
          S3DLIO_EXIT_ATTEMPTS: "8"
          S3DLIO_REQUIRE_TEST_HOOKS: "1"   # the #304 close-after-spawn test FAILS, not skips, without the hook
        run: |
          pip install pytest
          python -m pytest -q -rs python/tests/test_exit_daemon_threads_298.py

      # Fork safety (#297): parent states x child entry points, inherited objects, drop/exit,
      # the warning, fork while parent threads run s3dlio calls, nested fork, a multiprocessing
      # fork Pool, DataLoader-style workers, fork+exec, and a mock S3 server proving the child
      # opens its own connection while the parent's survives. Each child has a hang limit.
      - name: Test (Python - fork safety)
        run: |
          pip install pytest
          python -m pytest -q -rs python/tests/test_fork_297.py

      # The Rust unit tests of the Python extension (everything under `python_api::`: the release
      # queue, the async bridge, the store cache, ...) only compile with `extension-module`, which
      # leaves libpython unlinked: link the interpreter's SHARED libpython explicitly. Fails loudly
      # when the interpreter has none. (After the pyo3 0.29 upgrade, #298, move this to pyo3's
      # `auto-initialize` for tests and drop the RUSTFLAGS.)
      - name: Test (Rust unit tests of the Python extension)
        env:
          CARGO_TARGET_DIR: target-pyunit
        run: |
          LDLIB=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LDLIBRARY"))')
          LDVER=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LDVERSION"))')
          LIBDIR=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          case "$LDLIB" in
            *.so*) ;;
            *) echo "this interpreter has no shared libpython (LDLIBRARY=$LDLIB): cannot link the extension-module unit tests" >&2; exit 1 ;;
          esac
          export RUSTFLAGS="-C link-arg=-L$LIBDIR -C link-arg=-lpython$LDVER -C link-arg=-Wl,-rpath,$LIBDIR"
          cargo test --lib --offline --features extension-module,backend-azure -- python_api::

  # Rust-only integration tests that do not depend on the Python version. They
  # run once per OS, in parallel with the `test` matrix, instead of six times
  # inside it (2 OS x 3 Python versions).
  rust-extra:
    name: Rust integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      # Same network hardening as the `test` job (curl-8.x HTTP/2 bug).
      - name: Configure cargo network robustness
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [http]
          multiplexing = false
          timeout = 120
          EOF

      - name: Cache cargo registry, git deps, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-extra-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-extra-

      - name: Fetch dependencies (with retry)
        run: |
          for i in 1 2 3; do
            cargo fetch --locked && break
            echo "cargo fetch failed (attempt $i); retrying..."
            sleep $((i * 10))
          done

      # Fork safety (#297): tokio must not be built with its `parking_lot` feature (a fork child
      # follows dangling pointers in parking_lot's global table of parked threads and aborts),
      # and dashmap must stay the only user of parking_lot_core. Checked on the RESOLVED graph
      # for every feature set we ship, because a dependency can switch the feature back on.
      - name: Guard (tokio parking_lot feature)
        run: scripts/check_fork_safety_deps.sh

      # The fork-safety unit tests (ForkCell rebuild in a child, claim takeover, panic in init,
      # recursion, the no-drop rule), and the process-global state (runtime, rayon pool,
      # data generation) in a fork child; the second one is its own test binary, like the
      # op-log fork tests, because fork() in a process that runs unrelated tests on other
      # threads can inherit a lock they hold.
      - name: Test (Rust - fork safety)
        run: |
          cargo test --release --lib --offline fork_guard
          cargo test --release --offline --test fork_globals_297
          cargo test --release --offline --test fork_oplog_idle_297
          cargo test --release --offline --test fork_oplog_fifo_297
          cargo test --release --offline --test fork_oplog_edges_297

      # delete_batch bucket/server grouping (#179).  The integration test runs
      # against an in-process mock S3 endpoint (no network, no credentials).
      - name: Test (Rust - delete_batch bucket grouping)
        run: cargo test --release --offline --test test_delete_batch_buckets

      # The GCS and Azure adapters' delete_batch grouping is feature-gated, so
      # the plain `--lib` run in the `test` job does not compile or run it.
      - name: Test (Rust - delete_batch GCS/Azure grouping)
        run: cargo test --release --lib --offline --features backend-gcs,backend-azure delete_batch

      # The Apache Arrow object_store backend (#207).  `arrow-backend` and
      # `native-backends` are mutually exclusive, so it is built in isolation
      # with --no-default-features (never --all-features).  Nothing else in CI
      # compiles this feature, which is how its ObjectStore impl went stale.
      - name: Check (Rust - arrow-backend)
        run: cargo check --no-default-features --features arrow-backend --offline

      - name: Clippy (Rust - arrow-backend)
        run: cargo clippy --no-default-features --features arrow-backend --offline -- -D warnings

      - name: Test (Rust - arrow-backend)
        run: cargo test --no-default-features --features arrow-backend --offline --lib

      # Op-log (#168, #170): the zstd command-line tool is what the op-log
      # tests use to prove a finished log is a complete zstd stream.
      - name: Install zstd CLI (op-log tests)
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y zstd; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "apt-get update/install failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt-get failed (attempt $i); retrying..."
            sleep $((i * 5))
          done
          zstd --version

      # Every tests/oplog_lifecycle_*.rs is its own binary (= its own process,
      # because the op-log is process-global), run explicitly by name. Must run
      # as the default non-root runner user: the spawn-failure test lowers
      # RLIMIT_NPROC, which root / CAP_SYS_RESOURCE ignore. With
      # S3DLIO_REQUIRE_SPAWN_FAILURE_TEST=1 that test FAILS instead of quietly
      # returning when it cannot produce the failure.
      - name: Test (Rust - op-log lifecycle)
        env:
          S3DLIO_REQUIRE_SPAWN_FAILURE_TEST: "1"
        run: |
          set -euo pipefail
          if [ "$(id -u)" = "0" ]; then
            echo "op-log lifecycle tests must run as a non-root user" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(tests/oplog_lifecycle_*.rs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no tests/oplog_lifecycle_*.rs found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f" .rs)"
            echo "::group::$name"
            status=0
            cargo test --release --offline --test "$name" || status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done

      # #295 / #267: caller-buffer GET and typed HEAD for file:// and direct://. Every
      # tests/*_295.rs is its own binary (its own process: some set process-wide state such as a
      # panic hook or a tiny bounce pool), run by name. The scratch directory is on the runner's
      # disk and S3DLIO_REQUIRE_ODIRECT_TESTS=1 makes a test that would skip (no O_DIRECT, root
      # ignoring permissions) FAIL. direct_get_into_no_odirect_fs_295 stays opt-in: it needs a
      # ramfs mount (S3DLIO_TEST_NO_ODIRECT_DIR, see docs/Environment_Variables.md) and reports
      # SKIPPED here by design.
      - name: Test (Rust - file:// direct:// get_into, #295)
        env:
          S3DLIO_REQUIRE_ODIRECT_TESTS: "1"
        run: |
          set -euo pipefail
          export S3DLIO_TEST_DIR="$GITHUB_WORKSPACE/target/odirect-scratch"
          mkdir -p "$S3DLIO_TEST_DIR"
          shopt -s nullglob
          files=(tests/*_295.rs)
          if [ "${#files[@]}" -lt 10 ]; then
            echo "expected the tests/*_295.rs binaries, found ${#files[@]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f" .rs)"
            echo "::group::$name"
            status=0
            cargo test --release --offline --test "$name" || status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done

      # The same file stores in a binary built with panic = "abort" (a downstream crate's release
      # profile): a LocalSet read must work and must not abort. Builds the `abort-test` profile
      # (Cargo.toml), which recompiles the dependencies once.
      - name: Test (Rust - panic=abort LocalSet read/write, #295)
        run: scripts/test_panic_abort_295.sh

      # #300: run_on_global_rt and the sync wrappers inside a tokio LocalSet (the context matrix,
      # the unmarked-runtime hang case, hand-off accounting), then in a panic = "abort" build.
      - name: Test (Rust - sync wrappers in every tokio context, #300)
        run: cargo test --release --offline --test run_on_global_rt_contexts_300 -- --test-threads=1

      - name: Test (Rust - panic=abort LocalSet run_on_global_rt, #300)
        run: scripts/test_panic_abort_300.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Same cargo-network hardening as the Test job — see comments there.
      - name: Configure cargo network robustness
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [http]
          multiplexing = false
          timeout = 120
          EOF

      - name: Cache cargo registry, git deps, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-lint-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Fetch dependencies (with retry)
        run: |
          for i in 1 2 3; do
            cargo fetch --locked && break
            echo "cargo fetch failed (attempt $i); retrying..."
            sleep $((i * 10))
          done

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # --all-features omitted: native-backends and arrow-backend are mutually
        # exclusive (compile_error! guards this); defaults include native-backends.
        # Tests/benches are compiled and validated by the Test job above.
        run: cargo clippy --lib --bins --examples --offline -- -D warnings

  # Off-GIL drop oracle (#297). pyo3 normally lets any thread drop a `Py<..>`: it parks the
  # decref in a process-global mutex, and a parent thread holding that mutex at a fork() left the
  # child's first Python call waiting for ever. s3dlio removed every such drop. This wheel is
  # built with `--cfg pyo3_disable_reference_pool`, where dropping a `Py` without the GIL ABORTS
  # the process, so a regression crashes these tests. The released wheels keep the default pool
  # (the job above); this wheel is only for the tests below.
  offgil-oracle:
    name: Off-GIL drop oracle (abort-mode wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry, git deps, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-oracle
          # The RUSTFLAGS cfg is part of the key AND the build uses its own target directory, so a
          # pyo3 built without `--cfg pyo3_disable_reference_pool` can never be reused here (it
          # would make the oracle pass vacuously).
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-oracle-cfg-pyo3_disable_reference_pool-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the abort-mode wheel
        env:
          RUSTFLAGS: "--cfg pyo3_disable_reference_pool"
          CARGO_TARGET_DIR: target-oracle
        run: |
          pip install maturin
          maturin build --release --out dist-oracle --features extension-module,backend-azure
          pip install dist-oracle/*.whl


      - name: Test (fork matrix, no off-GIL drop, exit and put-release suites)
        run: |
          pip install pytest pytest-asyncio numpy
          python -m pytest -q -rs python/tests/test_fork_297.py python/tests/test_no_offgil_drop_297.py \
            tests/test_async_exit_no_segfault.py python/tests/test_put_release_barrier.py
